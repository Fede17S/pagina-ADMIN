<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DistriMar - Hoja de Ruta</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        :root { --blue: #0056b3; --green: #25d366; --red: #dc3545; --gray: #f4f7f6; --dark: #333; }
        body { font-family: -apple-system, sans-serif; background: var(--gray); margin: 0; padding: 0; color: var(--dark); }
        
        .tabs { display: flex; background: #fff; border-bottom: 2px solid #ddd; position: sticky; top: 0; z-index: 10; overflow-x: auto; }
        .tab-btn { flex: 1; padding: 15px 10px; border: none; background: none; font-weight: bold; cursor: pointer; color: #666; font-size: 11px; white-space: nowrap; }
        .tab-btn.active { color: var(--blue); border-bottom: 4px solid var(--blue); background: #f8faff; }

        .container { max-width: 900px; margin: 10px auto; padding: 10px; }
        .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: none; }
        .card.active { display: block; }

        input, textarea, select { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-blue { background: var(--blue); }
        .btn-green { background: var(--green); }
        .btn-red { background: var(--red); font-size: 11px; width: auto; padding: 8px 12px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid #eee; }
        .in-tabla { width: 60px; padding: 4px; margin: 0; font-size: 12px; }

        .search-area { background: #f1f3f5; padding: 12px; border-radius: 10px; margin: 10px 0; }
        .lista-resultados { max-height: 150px; overflow-y: auto; background: white; border: 1px solid #ccc; border-radius: 6px; }
        .item-prod { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; }
        .item-prod.seleccionado { background: var(--blue); color: white; }
    </style>
</head>
<body>

    <nav class="tabs">
        <button class="tab-btn active" onclick="verTab('pedido')">📝 PEDIDO</button>
        <button class="tab-btn" onclick="verTab('remito')">🚚 REMITO</button>
        <button class="tab-btn" onclick="verTab('hoja')">📋 HOJA RUTA</button>
        <button class="tab-btn" onclick="verTab('ajustes')">⚙️ AJUSTES</button>
    </nav>

    <div class="container">

        <div id="pedido" class="card active">
            <input type="text" id="idCli-ped" placeholder="ID Cliente..." onkeyup="buscarCli('ped')">
            <input type="text" id="nomCli-ped" placeholder="Nombre Cliente">
            <div class="search-area">
                <input type="text" id="bus-ped" placeholder="Producto..." onkeyup="filtrar('ped')">
                <div id="res-ped" class="lista-resultados"></div>
                <input type="number" id="cant-ped" value="1" style="width:70px">
                <button class="btn btn-blue" onclick="agregar('ped')">+ AGREGAR</button>
            </div>
            <table id="tabla-ped"><thead><tr><th>Cant</th><th>Detalle</th><th>Sub</th><th></th></tr></thead><tbody id="body-ped"></tbody></table>
            <textarea id="obs-ped" placeholder="Observaciones para el pedido..."></textarea>
            <h3 style="text-align:right">TOTAL: $<span id="total-ped">0.00</span></h3>
            <button class="btn btn-green" onclick="procesarDocumento('pedido')">🟢 MANDAR WHATSAPP</button>
        </div>

        <div id="remito" class="card">
            <input type="text" id="idCli-rem" placeholder="ID Cliente..." onkeyup="buscarCli('rem')">
            <input type="text" id="nomCli-rem" placeholder="Nombre Cliente">
            <div class="search-area">
                <input type="text" id="bus-rem" placeholder="Producto..." onkeyup="filtrar('rem')">
                <div id="res-rem" class="lista-resultados"></div>
                <input type="number" id="cant-rem" value="1" style="width:70px">
                <button class="btn btn-blue" onclick="agregar('rem')">+ AGREGAR</button>
            </div>
            <table id="tabla-rem"><thead><tr><th>Cant</th><th>Detalle</th><th>Sub</th><th></th></tr></thead><tbody id="body-rem"></tbody></table>
            <h3 style="text-align:right">TOTAL: $<span id="total-rem">0.00</span></h3>
            <button class="btn btn-blue" onclick="procesarDocumento('remito')">💾 GUARDAR Y SUMAR A RUTA</button>
        </div>

        <div id="hoja" class="card">
            <div style="text-align:center; margin-bottom:10px;">
                <strong>HOJA DE RUTA - DISTRIMAR</strong><br>
                <input type="text" id="repartidor" placeholder="Nombre del Repartidor" style="width:50%; text-align:center;">
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>Nombre</th><th>Importe</th><th>A Cuenta</th><th>Tipo</th><th>Debe</th><th></th>
                    </tr>
                </thead>
                <tbody id="body-hoja"></tbody>
            </table>
            <div style="margin-top:15px; background:#f9f9f9; padding:10px; border-radius:8px;">
                <p>TOTAL RENDICIÓN: $<span id="total-hoja">0.00</span></p>
                <p>TOTAL RECIBIDO: $<span id="recibido-hoja">0.00</span></p>
            </div>
            <button class="btn btn-gray" style="background:#444" onclick="imprimirHoja()">🖨️ DESCARGAR HOJA DE RUTA</button>
            <button class="btn-red" onclick="vaciarHoja()" style="margin-top:20px;">Borrar Hoja Actual</button>
        </div>

        <div id="ajustes" class="card">
            <h3>Logo</h3>
            <input type="file" id="subirLogo" accept="image/*">
            <img id="previewLogo" style="max-width:100px; display:none; margin-top:10px;">
            <hr>
            <h3>Importar Datos</h3>
            <label>Stock:</label><input type="file" id="xlStock" accept=".xlsx, .xls">
            <label>Clientes:</label><input type="file" id="xlCli" accept=".xlsx, .xls">
        </div>

    </div>

    <script>
        let dbStock = JSON.parse(localStorage.getItem('dm_stock_v10')) || [];
        let dbCli = JSON.parse(localStorage.getItem('dm_cli_v10')) || [];
        let hojaRuta = JSON.parse(localStorage.getItem('dm_hoja_v10')) || [];
        let logoBase64 = localStorage.getItem('dm_logo_v10') || "";
        let ordenes = { ped: [], rem: [] };
        let listas = { ped: "Clientes", rem: "Clientes" };
        let selIdx = { ped: null, rem: null };

        function verTab(id) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
            if(id === 'hoja') renderHoja();
        }

        // --- LÓGICA DE CARGA Y FILTRO (Mantenida de versiones anteriores) ---
        function buscarCli(t) {
            let id = document.getElementById(`idCli-${t}`).value;
            let c = dbCli.find(cli => cli.id.toString() === id);
            if(c) {
                document.getElementById(`nomCli-${t}`).value = c.nombre;
                listas[t] = c.lista.toLowerCase().includes("patagonia") ? "Patagonia" : "Clientes";
            }
            filtrar(t);
        }

        function filtrar(t) {
            let bus = document.getElementById(`bus-${t}`).value.toLowerCase();
            let box = document.getElementById(`res-${t}`);
            box.innerHTML = "";
            dbStock.forEach((p, i) => {
                if(p.n.toLowerCase().includes(bus)) {
                    let pre = (listas[t] === "Patagonia") ? p.pPat : p.pCli;
                    let div = document.createElement('div');
                    div.className = 'item-prod';
                    div.innerHTML = `<span>${p.n}</span> <strong>$${pre}</strong>`;
                    div.onclick = () => { selIdx[t] = i; box.innerHTML = ""; document.getElementById(`bus-${t}`).value = p.n; };
                    box.appendChild(div);
                }
            });
        }

        function agregar(t) {
            let c = parseInt(document.getElementById(`cant-${t}`).value);
            if(selIdx[t] !== null) {
                let p = dbStock[selIdx[t]];
                let pre = (listas[t] === "Patagonia") ? p.pPat : p.pCli;
                ordenes[t].push({n: p.n, p: pre, c: c, sub: pre * c});
                renderTabla(t);
            }
        }

        function renderTabla(t) {
            let h = ""; let tot = 0;
            ordenes[t].forEach((it, i) => {
                tot += it.sub;
                h += `<tr><td>${it.c}</td><td>${it.n}</td><td>$${it.sub}</td><td class="remove" onclick="ordenes['${t}'].splice(${i},1);renderTabla('${t}')">✕</td></tr>`;
            });
            document.getElementById(`total-${t}`).innerText = tot.toFixed(2);
            document.getElementById(`body-${t}`).innerHTML = h;
        }

        // --- PROCESAR REMITO Y SUMAR A HOJA DE RUTA ---
        async function procesarDocumento(modo) {
            const t = (modo === 'pedido') ? 'ped' : 'rem';
            if(ordenes[t].length === 0) return;

            let id = document.getElementById(`idCli-${t}`).value;
            let nom = document.getElementById(`nomCli-${t}`).value;
            let tot = parseFloat(document.getElementById(`total-${t}`).innerText);

            if(modo === 'remito') {
                // Sumar a la memoria de Hoja de Ruta
                hojaRuta.push({ id, nom, importe: tot, pago: 0, tipo: "Efectivo", debe: tot });
                localStorage.setItem('dm_hoja_v10', JSON.stringify(hojaRuta));
                alert("Remito guardado y sumado a la Hoja de Ruta.");
            }
            
            // (Aquí iría la lógica de generación de PDF que ya teníamos)
            // ...
            ordenes[t] = []; renderTabla(t);
        }

        // --- LÓGICA ESPECÍFICA HOJA DE RUTA ---
        function renderHoja() {
            let h = ""; let tImp = 0; let tRec = 0;
            hojaRuta.forEach((f, i) => {
                tImp += f.importe;
                tRec += f.pago;
                h += `<tr>
                    <td>${f.id}</td>
                    <td>${f.nom}</td>
                    <td>$${f.importe}</td>
                    <td><input type="number" class="in-tabla" value="${f.pago}" onchange="actHoja(${i}, 'pago', this.value)"></td>
                    <td>
                        <select class="in-tabla" style="width:80px" onchange="actHoja(${i}, 'tipo', this.value)">
                            <option value="Efe" ${f.tipo=='Efe'?'selected':''}>Efe</option>
                            <option value="Trans" ${f.tipo=='Trans'?'selected':''}>Trans</option>
                        </select>
                    </td>
                    <td style="color:${f.debe>0?'red':'green'}">$${f.debe}</td>
                    <td onclick="hojaRuta.splice(${i},1);renderHoja();" style="color:red">✕</td>
                </tr>`;
            });
            document.getElementById('body-hoja').innerHTML = h;
            document.getElementById('total-hoja').innerText = tImp.toFixed(2);
            document.getElementById('recibido-hoja').innerText = tRec.toFixed(2);
            localStorage.setItem('dm_hoja_v10', JSON.stringify(hojaRuta));
        }

        function actHoja(i, campo, valor) {
            if(campo === 'pago') {
                hojaRuta[i].pago = parseFloat(valor) || 0;
                hojaRuta[i].debe = hojaRuta[i].importe - hojaRuta[i].pago;
            } else {
                hojaRuta[i].tipo = valor;
            }
            renderHoja();
        }

        function vaciarHoja() { if(confirm("¿Borrar hoja de ruta?")) { hojaRuta = []; renderHoja(); } }

        async function imprimirHoja() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("HOJA DE RUTA - DISTRIMAR", 105, 15, {align:"center"});
            doc.setFontSize(10);
            doc.text(`Repartidor: ${document.getElementById('repartidor').value}`, 14, 25);
            doc.text(`Fecha: ${new Date().toLocaleDateString()}`, 160, 25);

            let data = hojaRuta.map(f => [f.id, f.nom, `$${f.importe}`, `$${f.pago}`, f.tipo, `$${f.debe}`]);
            doc.autoTable({
                startY: 30,
                head: [['ID', 'Cliente', 'Importe', 'Pago', 'Tipo', 'Debe']],
                body: data,
                theme: 'grid'
            });
            doc.save("HojaDeRuta.pdf");
        }

        // --- LOGO Y EXCEL ---
        document.getElementById('subirLogo').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = () => { logoBase64 = reader.result; localStorage.setItem('dm_logo_v10', logoBase64); };
            reader.readAsDataURL(e.target.files[0]);
        });
        
        document.getElementById('xlStock').addEventListener('change', function(e) {
            let reader = new FileReader();
            reader.onload = (ev) => {
                let wb = XLSX.read(new Uint8Array(ev.target.result), {type: 'array'});
                let filas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1});
                dbStock = filas.slice(1).map(f => ({n: f[0], pCli: f[1], pPat: f[2]}));
                localStorage.setItem('dm_stock_v10', JSON.stringify(dbStock));
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        });
        // (Idem para Clientes...)
    </script>
</body>
</html>
