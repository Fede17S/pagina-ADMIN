<div id="ajustes" class="card">
    <h3>⚙️ Herramientas de Carga Rápida</h3>
    
    <div style="background:#e7f3ff; padding:15px; border-radius:10px; border:1px solid #b6d4fe; margin-bottom:20px;">
        <strong>📄 Importador de Texto (PDF/Listas):</strong><br>
        <small>Copiá el texto de tu PDF de precios y pegalo acá abajo. Intentaré detectar Nombres y Precios automáticamente.</small>
        <textarea id="textoBruto" placeholder="Pegá acá el texto copiado del PDF..." style="height:100px; margin-top:10px;"></textarea>
        <button class="btn btn-blue" onclick="procesarTextoPegado()">⚡ PROCESAR Y CARGAR AL STOCK</button>
    </div>

    <hr>
    <h3>📦 Carga por Archivos Excel</h3>
    <p>Cargar Stock (Excel):</p> <input type="file" id="xlStock" accept=".xlsx, .xls">
    <p>Cargar Clientes (Excel):</p> <input type="file" id="xlCli" accept=".xlsx, .xls">
    </div>

<script>
// --- NUEVA FUNCIÓN PARA PROCESAR TEXTO PEGADO DE PDF ---
function procesarTextoPegado() {
    let texto = document.getElementById('textoBruto').value;
    if(!texto) return alert("Pegá algo de texto primero");

    // Dividimos por líneas
    let lineas = texto.split('\n');
    let nuevosProductos = [];

    lineas.forEach(linea => {
        // Buscamos patrones de precios (ejemplo: $ 1.200,50 o 1200.50)
        // Esta regex busca un nombre seguido de un número al final
        let partes = linea.match(/(.*?)\s+\$?\s?([0-9\.,]+)$/);
        
        if(partes && partes.length >= 3) {
            let nombre = partes[1].trim();
            let precioStr = partes[2].replace(/\./g, '').replace(',', '.');
            let precio = parseFloat(precioStr);

            if(nombre && !isNaN(precio)) {
                nuevosProductos.push({
                    n: nombre,
                    pCli: precio,
                    pPat: precio // Por defecto igualamos, luego se puede ajustar
                });
            }
        }
    });

    if(nuevosProductos.length > 0) {
        if(confirm(`He detectado ${nuevosProductos.length} productos. ¿Deseas sumarlos al stock actual?`)) {
            dbStock = [...dbStock, ...nuevosProductos];
            localStorage.setItem(K_STK, JSON.stringify(dbStock));
            alert("✅ ¡Stock actualizado con éxito!");
            document.getElementById('textoBruto').value = "";
        }
    } else {
        alert("No pude detectar el formato. Probá pasándome el PDF a mí para que yo te arme el Excel prolijo.");
    }
}
</script>
