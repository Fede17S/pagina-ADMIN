<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DistriMar - V16 Multi-Listas</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        :root {
            --blue: #0056b3; --green: #25d366; --red: #dc3545;
            --bg: #f4f7f6; --card-bg: #ffffff; --text: #333; --border: #ddd;
            --input-bg: #fff; --search-bg: #f1f3f5;
        }
        [data-theme="dark"] {
            --bg: #121212; --card-bg: #1e1e1e; --text: #e0e0e0; --border: #333;
            --input-bg: #2d2d2d; --search-bg: #2d2d2d;
        }

        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; transition: 0.3s; }
        .tabs { display: flex; background: var(--card-bg); border-bottom: 2px solid var(--border); position: sticky; top: 0; z-index: 10; }
        .tab-btn { flex: 1; padding: 15px 5px; border: none; background: none; font-weight: bold; cursor: pointer; color: #888; font-size: 11px; }
        .tab-btn.active { color: var(--blue); border-bottom: 4px solid var(--blue); background: rgba(0,86,179,0.05); }
        
        .container { max-width: 900px; margin: 10px auto; padding: 10px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none; }
        .card.active { display: block; }

        input, textarea, select { 
            width: 100%; padding: 12px; margin: 5px 0; border: 1px solid var(--border); 
            border-radius: 8px; background: var(--input-bg); color: var(--text); font-size: 16px; box-sizing: border-box;
        }

        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-blue { background: var(--blue); }
        .btn-green { background: var(--green); }
        .btn-red { background: var(--red); font-size: 12px; }

        .search-area { background: var(--search-bg); padding: 12px; border-radius: 10px; margin: 10px 0; }
        .lista-resultados { max-height: 200px; overflow-y: auto; background: var(--input-bg); border: 1px solid var(--border); border-radius: 6px; }
        .item-prod { padding: 12px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; justify-content: space-between; }
        
        table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
        th, td { text-align: left; padding: 10px 5px; border-bottom: 1px solid var(--border); }
        .remove { color: var(--red); font-weight: bold; cursor: pointer; }

        .manual-box { background: #fff3cd; padding: 10px; border-radius: 8px; margin: 10px 0; color: #856404; display: none; }
        [data-theme="dark"] .manual-box { background: #332b00; color: #ffecb5; }
    </style>
</head>
<body>

    <nav class="tabs">
        <button class="tab-btn active" onclick="verTab('pedido')">📝 PEDIDO</button>
        <button class="tab-btn" onclick="verTab('remito')">🚚 REMITO</button>
        <button class="tab-btn" onclick="verTab('ajustes')">⚙️ CONFIG</button>
        <button style="background:none; border:none; cursor:pointer;" onclick="toggleTheme()">🌓</button>
    </nav>

    <div class="container">

        <div style="margin-bottom: 15px;">
            <label style="font-size: 12px; font-weight: bold;">📦 CATÁLOGO ACTIVO:</label>
            <select id="selectorStock" onchange="cambiarListaActiva()">
                <option value="">Cargando listas...</option>
            </select>
        </div>

        <div id="pedido" class="card active">
            <div style="display: flex; gap: 5px;">
                <input type="text" id="idCli-ped" placeholder="ID Cliente..." onkeyup="buscarCli('ped')">
                <button class="btn btn-blue" style="width: 50px; margin: 5px 0;" onclick="activarManual('ped')">✍️</button>
            </div>
            
            <div id="manual-ped" class="manual-box">
                <b>Modo Manual:</b> Ingresá nombre y elegí lista.
                <select id="manualLista-ped" onchange="actualizarTipoLista('ped')">
                    <option value="Clientes">Lista General</option>
                    <option value="Patagonia">Lista Patagonia</option>
                </select>
            </div>

            <input type="text" id="nomCli-ped" placeholder="Nombre del Cliente" readonly>
            
            <div class="search-area">
                <input type="text" id="bus-ped" placeholder="Buscar producto..." onkeyup="filtrar('ped')">
                <div id="res-ped" class="lista-resultados"></div>
                <input type="number" id="cant-ped" value="1" style="width:100px; margin-top:10px;">
                <button class="btn btn-blue" onclick="agregar('ped')">+ AGREGAR AL CARRITO</button>
            </div>

            <table id="tabla-ped">
                <thead><tr><th>Cant</th><th>Producto</th><th>Subtotal</th><th></th></tr></thead>
                <tbody id="body-ped"></tbody>
            </table>
            <h3 style="text-align:right">TOTAL: $<span id="total-ped">0.00</span></h3>
            <button class="btn btn-green" onclick="generarPDF('pedido')">🟢 ENVIAR PEDIDO (WhatsApp/PDF)</button>
        </div>

        <div id="ajustes" class="card">
            <h3>📂 Gestión de Listas y Datos</h3>
            
            <div class="search-area">
                <strong>1. Cargar Nuevo Catálogo de Precios:</strong>
                <input type="text" id="nombreNuevaLista" placeholder="Nombre (ej: Ofertas Junio)">
                <input type="file" id="xlStock" accept=".xlsx, .xls">
                <small>El Excel debe tener: Nombre | Precio General | Precio Patagonia</small>
            </div>

            <div class="search-area">
                <strong>2. Cargar Base de Clientes:</strong>
                <input type="file" id="xlCli" accept=".xlsx, .xls">
            </div>

            <div class="search-area">
                <strong>3. Logo de la Empresa:</strong>
                <input type="file" id="subirLogo" accept="image/*">
            </div>

            <button class="btn btn-red" onclick="borrarTodo()">⚠️ BORRAR TODA LA MEMORIA</button>
        </div>

    </div>

    <script>
        // CLAVES DE MEMORIA
        const K_LISTAS = 'DM_LISTAS_INDEX'; // Índice de nombres de listas de stock
        const K_CLI = 'DM_CLI_V16';
        const K_LGO = 'DM_LGO_V16';
        const K_THEME = 'DM_THEME_V16';

        let misListas = JSON.parse(localStorage.getItem(K_LISTAS)) || {}; // { "Nombre": [data] }
        let dbCli = JSON.parse(localStorage.getItem(K_CLI)) || [];
        let stockActivo = [];
        let listaActualNombre = localStorage.getItem('DM_LAST_LIST') || "";
        let logoB64 = localStorage.getItem(K_LGO) || "";

        // INICIO
        window.onload = () => {
            actualizarSelector();
            if(localStorage.getItem(K_THEME) === 'dark') toggleTheme(true);
        };

        function actualizarSelector() {
            const sel = document.getElementById('selectorStock');
            sel.innerHTML = "";
            Object.keys(misListas).forEach(nombre => {
                let opt = document.createElement('option');
                opt.value = nombre; opt.innerText = nombre;
                if(nombre === listaActualNombre) opt.selected = true;
                sel.appendChild(opt);
            });
            if(Object.keys(misListas).length === 0) {
                sel.innerHTML = "<option>No hay listas cargadas</option>";
            }
            cambiarListaActiva();
        }

        function cambiarListaActiva() {
            listaActualNombre = document.getElementById('selectorStock').value;
            stockActivo = misListas[listaActualNombre] || [];
            localStorage.setItem('DM_LAST_LIST', listaActualNombre);
        }

        // CLIENTES
        let tipoListaActual = "Clientes";

        function buscarCli(t) {
            let id = document.getElementById(`idCli-${t}`).value.trim();
            let c = dbCli.find(cli => cli.id.toString() === id);
            let nomInput = document.getElementById(`nomCli-${t}`);
            
            if(c) {
                nomInput.value = c.nombre;
                nomInput.readOnly = true;
                tipoListaActual = c.lista.toLowerCase().includes("patagonia") ? "Patagonia" : "Clientes";
                document.getElementById(`manual-${t}`).style.display = 'none';
            } else {
                nomInput.value = "❌ No encontrado";
            }
        }

        function activarManual(t) {
            let nomInput = document.getElementById(`nomCli-${t}`);
            nomInput.readOnly = false;
            nomInput.value = "";
            nomInput.focus();
            document.getElementById(`manual-${t}`).style.display = 'block';
            tipoListaActual = document.getElementById(`manualLista-${t}`).value;
        }

        function actualizarTipoLista(t) {
            tipoListaActual = document.getElementById(`manualLista-${t}`).value;
        }

        // FILTRADO Y CARRITO
        let orden = [];
        let itemSel = null;

        function filtrar(t) {
            let bus = document.getElementById(`bus-${t}`).value.toLowerCase();
            let box = document.getElementById(`res-${t}`);
            box.innerHTML = ""; itemSel = null;
            if(bus.length < 2) return;

            stockActivo.forEach((p, i) => {
                if(p.n.toLowerCase().includes(bus)) {
                    let precio = (tipoListaActual === "Patagonia") ? p.pPat : p.pCli;
                    let div = document.createElement('div');
                    div.className = 'item-prod';
                    div.innerHTML = `<span>${p.n}</span> <b>$${precio}</b>`;
                    div.onclick = () => {
                        itemSel = { ...p, precioSeleccionado: precio };
                        document.getElementById(`bus-${t}`).value = p.n;
                        box.innerHTML = "";
                    };
                    box.appendChild(div);
                }
            });
        }

        function agregar(t) {
            let cant = parseInt(document.getElementById(`cant-${t}`).value);
            if(itemSel && cant > 0) {
                orden.push({ n: itemSel.n, p: itemSel.precioSeleccionado, c: cant, sub: itemSel.precioSeleccionado * cant });
                renderTabla(t);
                document.getElementById(`bus-${t}`).value = "";
                itemSel = null;
            }
        }

        function renderTabla(t) {
            let h = ""; let total = 0;
            orden.forEach((it, i) => {
                total += it.sub;
                h += `<tr><td>${it.c}</td><td>${it.n}</td><td>$${it.sub.toFixed(2)}</td><td class="remove" onclick="orden.splice(${i},1);renderTabla('${t}')">✕</td></tr>`;
            });
            document.getElementById(`body-${t}`).innerHTML = h;
            document.getElementById(`total-${t}`).innerText = total.toFixed(2);
        }

        // CARGA DE ARCHIVOS
        document.getElementById('xlStock').addEventListener('change', function(e) {
            let nombre = document.getElementById('nombreNuevaLista').value.trim();
            if(!nombre) return alert("Poné un nombre a la lista antes de subirla");
            
            let r = new FileReader();
            r.onload = (ev) => {
                let data = new Uint8Array(ev.target.result);
                let wb = XLSX.read(data, {type: 'array'});
                let raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1});
                
                let procesado = raw.slice(1).filter(r => r[0]).map(r => ({
                    n: r[0], pCli: parseFloat(r[1]) || 0, pPat: parseFloat(r[2]) || 0
                }));

                misListas[nombre] = procesado;
                localStorage.setItem(K_LISTAS, JSON.stringify(misListas));
                alert("Lista '" + nombre + "' cargada con éxito!");
                actualizarSelector();
            };
            r.readAsArrayBuffer(e.target.files[0]);
        });

        document.getElementById('xlCli').addEventListener('change', function(e) {
            let r = new FileReader();
            r.onload = (ev) => {
                let wb = XLSX.read(new Uint8Array(ev.target.result), {type: 'array'});
                let raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1});
                dbCli = raw.slice(1).filter(r => r[0]).map(r => ({
                    id: r[0].toString(), nombre: r[1], lista: r[2] || "Clientes"
                }));
                localStorage.setItem(K_CLI, JSON.stringify(dbCli));
                alert("Base de clientes actualizada.");
            };
            r.readAsArrayBuffer(e.target.files[0]);
        });

        // UTILIDADES
        function verTab(id) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function toggleTheme(forceDark = false) {
            let theme = document.documentElement.getAttribute("data-theme");
            if(theme === "dark" && !forceDark) {
                document.documentElement.setAttribute("data-theme", "light");
                localStorage.setItem(K_THEME, 'light');
            } else {
                document.documentElement.setAttribute("data-theme", "dark");
                localStorage.setItem(K_THEME, 'dark');
            }
        }

        async function generarPDF(m) {
            if(orden.length === 0) return alert("Carrito vacío");
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let cli = document.getElementById(`nomCli-ped`).value;
            
            doc.setFontSize(18); doc.text("DISTRIMAR - PEDIDO", 105, 20, {align:"center"});
            doc.setFontSize(12); doc.text("Cliente: " + cli, 14, 30);
            doc.text("Catálogo: " + listaActualNombre, 14, 37);

            doc.autoTable({
                startY: 45,
                head: [['Cant', 'Producto', 'P. Unit', 'Subtotal']],
                body: orden.map(i => [i.c, i.n, `$${i.p}`, `$${i.sub.toFixed(2)}`]),
            });

            const blob = doc.output('blob');
            const file = new File([blob], `Pedido_${cli}.pdf`, { type: 'application/pdf' });
            if (navigator.share) {
                await navigator.share({ files: [file], title: 'Pedido DistriMar' });
            } else {
                doc.save(`Pedido_${cli}.pdf`);
            }
        }

        function borrarTodo() { if(confirm("¿Borrar todo?")) { localStorage.clear(); location.reload(); } }
    </script>
</body>
</html>
