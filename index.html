<script>
    const K = { STK: 'DM_STK_V33', CLI: 'DM_CLI_V33', HOJ: 'DM_HOJ_V33', URL_STK: 'DM_URL_STK', URL_CLI: 'DM_URL_CLI' };
    
    // LOGO DISTRIMAR EN BASE64
    const LOGO_BASE64 = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMgAAADICAYAAACtWK6eAAAACXBIWXMAAAsTAAALEwEAmpwYAAAA..."; // (He acortado esto por espacio, usa el código completo abajo)

    let dbStock = [], dbCli = [], hojaRuta = JSON.parse(localStorage.getItem(K.HOJ)) || [];
    let ordenes = { ped: [], rem: [] }, tipoLista = { ped: "Clientes", rem: "Clientes" }, itemSel = { ped: null, rem: null };

    // ... (Funciones parseLocalFloat, fM, splitCSV, window.onload, sincronizarTodo, actualizarDL, vincularCli, filtrar, agregar, renderTabla, renderHoja permanecen igual) ...

    async function generarPDF(m) {
        const t = (m === 'pedido') ? 'ped' : 'rem'; 
        if(ordenes[t].length === 0) return;
        
        const { jsPDF } = window.jspdf; 
        const doc = new jsPDF();
        
        let nom = document.getElementById(`nomCli-${t}`).value || "Mostrador";
        let tot = document.getElementById(`total-${t}`).innerText;
        let obs = document.getElementById(`obs-${t}`).value.trim();

        // --- ENCABEZADO CON LOGO ---
        // Insertamos el logo (x, y, ancho, alto)
        // Nota: He usado una versión simplificada del logo. Para el código final, pega aquí el Base64 de tu imagen.
        try {
            doc.addImage(LOGO_BASE64, 'PNG', 14, 10, 30, 30);
        } catch(e) { console.error("Error al cargar logo", e); }

        doc.setFontSize(18);
        doc.setTextColor(0, 86, 179); // Azul DistriMar
        doc.setFont("helvetica", "bold");
        doc.text("DISTRIMAR", 50, 22);
        
        doc.setFontSize(14);
        doc.setTextColor(100);
        doc.text(m.toUpperCase(), 50, 30);
        
        // Datos del comprobante a la derecha del logo
        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        doc.setTextColor(50);
        doc.text(`Cliente: ${nom}`, 50, 38);
        doc.text(`Lista: ${tipoLista[t]}`, 50, 43);
        doc.text(`Fecha: ${new Date().toLocaleDateString()} ${new Date().toLocaleTimeString()}`, 140, 22);

        // --- TABLA DE PRODUCTOS ---
        doc.autoTable({ 
            startY: 48, 
            head: [['Cant', 'Cod', 'Producto', 'P.U', 'Sub']], 
            body: ordenes[t].map(i => [i.c, i.id, i.n, `$${fM(i.p)}`, `$${fM(i.sub)}`]),
            foot: [['','','','TOTAL',`$${tot}`]],
            theme: 'striped',
            headStyles: { fillColor: [0, 86, 179], fontSize: 11 },
            footStyles: { fillColor: [240, 240, 240], textColor: [0, 0, 0], fontSize: 12, fontStyle: 'bold' },
            margin: { left: 14, right: 14 }
        });

        // OBSERVACIONES
        if(obs !== "") {
            let finalY = doc.lastAutoTable.finalY + 10;
            doc.setFontSize(11);
            doc.setFont("helvetica", "bold");
            doc.text("OBSERVACIONES:", 14, finalY);
            doc.setFont("helvetica", "normal");
            let splitObs = doc.splitTextToSize(obs, 180);
            doc.text(splitObs, 14, finalY + 7);
        }

        if(m === 'remito') {
            hojaRuta.push({ id: document.getElementById(`idCli-rem`).value, nom: nom, importe: parseLocalFloat(tot), pago: 0 });
            localStorage.setItem(K.HOJ, JSON.stringify(hojaRuta));
        }

        const blob = doc.output('blob'), file = new File([blob], `${m}_${nom}.pdf`, { type: 'application/pdf' });
        if(navigator.share) await navigator.share({ files: [file] }); else doc.save(`${m}_${nom}.pdf`);
        
        ordenes[t] = []; 
        document.getElementById(`obs-${t}`).value = "";
        renderTabla(t);
    }

    // ... (Resto de funciones: descargarHojaRuta, verTab, guardarCloud) ...
</script>
