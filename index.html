<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DistriMar - V21 Dual Price</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        :root {
            --blue: #0056b3; --green: #25d366; --red: #dc3545;
            --bg: #f4f7f6; --card-bg: #ffffff; --text: #333; --border: #ddd;
            --input-bg: #fff; --search-bg: #f1f3f5;
        }
        [data-theme="dark"] {
            --bg: #121212; --card-bg: #1e1e1e; --text: #e0e0e0; --border: #333;
            --input-bg: #2d2d2d; --search-bg: #2d2d2d;
        }

        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; transition: 0.3s; }
        .tabs { display: flex; background: var(--card-bg); border-bottom: 2px solid var(--border); position: sticky; top: 0; z-index: 10; }
        .tab-btn { flex: 1; padding: 15px 5px; border: none; background: none; font-weight: bold; cursor: pointer; color: #888; font-size: 11px; }
        .tab-btn.active { color: var(--blue); border-bottom: 4px solid var(--blue); background: rgba(0,86,179,0.05); }
        
        .container { max-width: 900px; margin: 10px auto; padding: 10px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none; }
        .card.active { display: block; }

        input, select, textarea { 
            width: 100%; padding: 12px; margin: 5px 0; border: 1px solid var(--border); 
            border-radius: 8px; background: var(--input-bg); color: var(--text); font-size: 16px; box-sizing: border-box;
        }

        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-blue { background: var(--blue); }
        .btn-green { background: var(--green); }
        .btn-red { background: var(--red); font-size: 12px; }

        .search-area { background: var(--search-bg); padding: 12px; border-radius: 10px; margin: 10px 0; border: 1px solid var(--border); }
        .lista-resultados { max-height: 250px; overflow-y: auto; background: var(--input-bg); border: 1px solid var(--border); border-radius: 6px; }
        .item-prod { padding: 12px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .cod-badge { background: #eee; color: #444; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-right: 8px; }
        [data-theme="dark"] .cod-badge { background: #444; color: #eee; }

        table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
        th, td { text-align: left; padding: 10px 5px; border-bottom: 1px solid var(--border); }
        .remove { color: var(--red); font-weight: bold; cursor: pointer; text-align: center; }
        
        .badge { display: inline-block; padding: 3px 8px; border-radius: 5px; background: var(--blue); color: #fff; font-size: 10px; margin-top: 5px; }
        #previewLogo { max-width: 150px; margin: 10px 0; border-radius: 8px; display: none; }
    </style>
</head>
<body>

    <nav class="tabs">
        <button class="tab-btn active" onclick="verTab('pedido')">📝 PEDIDO</button>
        <button class="tab-btn" onclick="verTab('remito')">🚚 REMITO</button>
        <button class="tab-btn" onclick="verTab('hoja')">📋 RUTA</button>
        <button class="tab-btn" onclick="verTab('ajustes')">⚙️ CONFIG</button>
        <button style="background:none; border:none; cursor:pointer;" onclick="toggleTheme()">🌓</button>
    </nav>

    <div class="container">

        <div id="pedido" class="card active">
            <div style="display: flex; gap: 5px;">
                <input type="text" id="idCli-ped" placeholder="ID Cliente..." onkeyup="buscarCli('ped')">
                <button class="btn btn-blue" style="width: 50px; margin: 5px 0;" onclick="activarManual('ped')">✍️</button>
            </div>
            <div id="manual-ped" style="display:none; background:rgba(128,128,128,0.1); padding:10px; border-radius:8px; margin-bottom:5px;">
                <select id="manualLista-ped" onchange="actualizarTipoLista('ped')">
                    <option value="Clientes">Lista General</option>
                    <option value="Patagonia">Lista Patagonia</option>
                </select>
            </div>
            <input type="text" id="nomCli-ped" placeholder="Nombre del Cliente" readonly>
            <div id="badge-ped" class="badge">Lista: Clientes</div>

            <div class="search-area">
                <input type="text" id="bus-ped" placeholder="Buscar por CÓDIGO o NOMBRE..." onkeyup="filtrar('ped')">
                <div id="res-ped" class="lista-resultados"></div>
                <input type="number" id="cant-ped" value="1" style="width:100px; margin-top:10px;">
                <button class="btn btn-blue" onclick="agregar('ped')">+ AGREGAR</button>
            </div>

            <table id="tabla-ped">
                <thead><tr><th>Cant</th><th>Producto</th><th>Sub</th><th></th></tr></thead>
                <tbody id="body-ped"></tbody>
            </table>
            <textarea id="obs-ped" placeholder="Observaciones..." rows="2"></textarea>
            <h3 style="text-align:right">TOTAL: $<span id="total-ped">0.00</span></h3>
            <button class="btn btn-green" onclick="generarPDF('pedido')">🟢 ENVIAR PEDIDO</button>
        </div>

        <div id="remito" class="card">
            <div style="display: flex; gap: 5px;">
                <input type="text" id="idCli-rem" placeholder="ID Cliente..." onkeyup="buscarCli('rem')">
                <button class="btn btn-blue" style="width: 50px; margin: 5px 0;" onclick="activarManual('rem')">✍️</button>
            </div>
            <div id="manual-rem" style="display:none; background:rgba(128,128,128,0.1); padding:10px; border-radius:8px; margin-bottom:5px;">
                <select id="manualLista-rem" onchange="actualizarTipoLista('rem')">
                    <option value="Clientes">Lista General</option>
                    <option value="Patagonia">Lista Patagonia</option>
                </select>
            </div>
            <input type="text" id="nomCli-rem" placeholder="Nombre del Cliente" readonly>
            <div id="badge-rem" class="badge">Lista: Clientes</div>

            <div class="search-area">
                <input type="text" id="bus-rem" placeholder="Buscar por CÓDIGO o NOMBRE..." onkeyup="filtrar('rem')">
                <div id="res-rem" class="lista-resultados"></div>
                <input type="number" id="cant-rem" value="1" style="width:100px; margin-top:10px;">
                <button class="btn btn-blue" onclick="agregar('rem')">+ AGREGAR</button>
            </div>

            <table id="tabla-rem">
                <thead><tr><th>Cant</th><th>Producto</th><th>Sub</th><th></th></tr></thead>
                <tbody id="body-rem"></tbody>
            </table>
            <textarea id="obs-rem" placeholder="Observaciones..." rows="2"></textarea>
            <h3 style="text-align:right">TOTAL: $<span id="total-rem">0.00</span></h3>
            <button class="btn btn-blue" onclick="generarPDF('remito')">💾 GUARDAR Y SUMAR A RUTA</button>
        </div>

        <div id="hoja" class="card">
            <h3>📋 Rendición de Ruta</h3>
            <div id="lista-hoja">
                <table>
                    <thead><tr><th>ID</th><th>Cliente</th><th>Total</th><th>Pago</th><th>Saldo</th><th></th></tr></thead>
                    <tbody id="body-hoja"></tbody>
                </table>
            </div>
            <button class="btn btn-green" onclick="descargarHojaRuta()">📥 DESCARGAR HOJA PDF</button>
            <button class="btn-red" onclick="borrarHoja()" style="margin-top:30px">VACIAR HOJA</button>
        </div>

        <div id="ajustes" class="card">
            <h3>📂 Configuración</h3>
            <div class="search-area">
                <strong>Logo de la Empresa:</strong>
                <input type="file" id="subirLogo" accept="image/*">
                <img id="previewLogo" alt="Logo">
            </div>
            <div class="search-area">
                <strong>Catálogo Único (ID, Nom, Precio, Patagonia):</strong>
                <input type="file" id="xlStock" accept=".xlsx, .xls">
            </div>
            <div class="search-area">
                <strong>Base de Clientes:</strong>
                <input type="file" id="xlCli" accept=".xlsx, .xls">
            </div>
            <button class="btn btn-red" onclick="borrarTodo()">BORRAR TODO</button>
        </div>

    </div>

    <script>
        const K_STK = 'DM_STK_V21'; const K_CLI = 'DM_CLI_V21'; const K_HOJ = 'DM_HOJ_V21'; const K_LGO = 'DM_LGO_V21';

        let dbStock = JSON.parse(localStorage.getItem(K_STK)) || [];
        let dbCli = JSON.parse(localStorage.getItem(K_CLI)) || [];
        let hojaRuta = JSON.parse(localStorage.getItem(K_HOJ)) || [];
        let logoB64 = localStorage.getItem(K_LGO) || "";
        let ordenes = { ped: [], rem: [] };
        let tipoLista = { ped: "Clientes", rem: "Clientes" };
        let itemSel = { ped: null, rem: null };

        window.onload = () => {
            if(logoB64) { document.getElementById('previewLogo').src = logoB64; document.getElementById('previewLogo').style.display = 'block'; }
            if(localStorage.getItem('DM_THEME') === 'dark') document.documentElement.setAttribute("data-theme", "dark");
        };

        function verTab(id) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
            if(id === 'hoja') renderHoja();
        }

        function toggleTheme() {
            let t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", t);
            localStorage.setItem('DM_THEME', t);
        }

        function buscarCli(t) {
            let id = document.getElementById(`idCli-${t}`).value.trim();
            let c = dbCli.find(cli => cli.id.toString() === id);
            if(c) {
                document.getElementById(`nomCli-${t}`).value = c.nombre;
                tipoLista[t] = c.lista.toLowerCase().includes("patagonia") ? "Patagonia" : "Clientes";
                document.getElementById(`badge-${t}`).innerText = "Lista: " + tipoLista[t];
                document.getElementById(`manual-${t}`).style.display = 'none';
            }
        }

        function activarManual(t) {
            document.getElementById(`nomCli-${t}`).readOnly = false;
            document.getElementById(`nomCli-${t}`).value = "";
            document.getElementById(`manual-${t}`).style.display = 'block';
        }

        function actualizarTipoLista(t) {
            tipoLista[t] = document.getElementById(`manualLista-${t}`).value;
            document.getElementById(`badge-${t}`).innerText = "Lista: " + tipoLista[t];
        }

        function filtrar(t) {
            let bus = document.getElementById(`bus-${t}`).value.toLowerCase();
            let box = document.getElementById(`res-${t}`);
            box.innerHTML = ""; itemSel[t] = null;
            if(bus.length < 1) return;

            dbStock.forEach(p => {
                if(p.id.toLowerCase().includes(bus) || p.n.toLowerCase().includes(bus)) {
                    let precio = (tipoLista[t] === "Patagonia") ? p.pPat : p.pCli;
                    let div = document.createElement('div');
                    div.className = 'item-prod';
                    div.innerHTML = `<div><span class="cod-badge">${p.id}</span> ${p.n}</div><b>$${precio.toFixed(2)}</b>`;
                    div.onclick = () => {
                        itemSel[t] = { ...p, pre: precio };
                        document.getElementById(`bus-${t}`).value = `[${p.id}] ${p.n}`;
                        box.innerHTML = "";
                    };
                    box.appendChild(div);
                }
            });
        }

        function agregar(t) {
            let cant = parseInt(document.getElementById(`cant-${t}`).value);
            if(itemSel[t] && cant > 0) {
                ordenes[t].push({ id: itemSel[t].id, n: itemSel[t].n, p: itemSel[t].pre, c: cant, sub: itemSel[t].pre * cant });
                renderTabla(t);
                document.getElementById(`bus-${t}`).value = ""; itemSel[t] = null;
            }
        }

        function renderTabla(t) {
            let h = ""; let total = 0;
            ordenes[t].forEach((it, i) => {
                total += it.sub;
                h += `<tr><td>${it.c}</td><td>(${it.id}) ${it.n}</td><td>$${it.sub.toFixed(2)}</td><td class="remove" onclick="ordenes['${t}'].splice(${i},1);renderTabla('${t}')">✕</td></tr>`;
            });
            document.getElementById(`total-${t}`).innerText = total.toFixed(2);
            document.getElementById(`body-${t}`).innerHTML = h;
        }

        function renderHoja() {
            let h = "";
            hojaRuta.forEach((f, i) => {
                h += `<tr><td>${f.id}</td><td>${f.nom}</td><td>$${f.importe.toFixed(2)}</td>
                <td><input type="number" style="width:70px" value="${f.pago}" onchange="hojaRuta[${i}].pago=this.value;renderHoja()"></td>
                <td>$${(f.importe - f.pago).toFixed(2)}</td>
                <td class="remove" onclick="hojaRuta.splice(${i},1);renderHoja()">✕</td></tr>`;
            });
            document.getElementById('body-hoja').innerHTML = h;
            localStorage.setItem(K_HOJ, JSON.stringify(hojaRuta));
        }

        async function generarPDF(m) {
            const t = (m === 'pedido') ? 'ped' : 'rem';
            if(ordenes[t].length === 0) return alert("Carrito vacío");
            const { jsPDF } = window.jspdf; const doc = new jsPDF();
            let nomCli = document.getElementById(`nomCli-${t}`).value;
            let idCli = document.getElementById(`idCli-${t}`).value;
            let obs = document.getElementById(`obs-${t}`).value;
            let tot = document.getElementById(`total-${t}`).innerText;

            if(logoB64) doc.addImage(logoB64, 'PNG', 14, 10, 30, 30);
            doc.setFontSize(18); doc.text("DISTRIMAR - " + m.toUpperCase(), 105, 25, {align:"center"});
            doc.setFontSize(10);
            doc.text(`Cliente: ${nomCli} (ID: ${idCli})`, 14, 45);
            doc.text(`Lista: ${tipoLista[t]} | Fecha: ${new Date().toLocaleDateString()}`, 14, 50);

            doc.autoTable({
                startY: 55, head: [['Cant', 'Cod', 'Producto', 'P.U', 'Sub']],
                body: ordenes[t].map(i => [i.c, i.id, i.n, `$${i.p.toFixed(2)}`, `$${i.sub.toFixed(2)}`]),
                foot: [['','','','TOTAL',`$${tot}`]]
            });

            if(obs) { doc.text("OBSERVACIONES:", 14, doc.lastAutoTable.finalY + 10); doc.text(obs, 14, doc.lastAutoTable.finalY + 15); }

            if(m === 'remito') {
                hojaRuta.push({ id: idCli, nom: nomCli, importe: parseFloat(tot), pago: 0 });
                localStorage.setItem(K_HOJ, JSON.stringify(hojaRuta));
            }
            
            const blob = doc.output('blob');
            const file = new File([blob], `${m}_${nomCli}.pdf`, { type: 'application/pdf' });
            if(navigator.share) await navigator.share({ files: [file] }); else doc.save(`${m}_${nomCli}.pdf`);
            
            ordenes[t] = []; document.getElementById(`obs-${t}`).value = ""; renderTabla(t);
        }

        function descargarHojaRuta() {
            const { jsPDF } = window.jspdf; const doc = new jsPDF();
            doc.text("HOJA DE RUTA - DISTRIMAR", 105, 20, {align:"center"});
            doc.autoTable({
                startY: 30, head: [['ID', 'Cliente', 'Importe', 'Pago', 'Saldo']],
                body: hojaRuta.map(f => [f.id, f.nom, `$${f.importe.toFixed(2)}`, `$${parseFloat(f.pago).toFixed(2)}`, `$${(f.importe - f.pago).toFixed(2)}`])
            });
            doc.save("Hoja_Ruta.pdf");
        }

        // --- EXCEL ---
        document.getElementById('xlStock').addEventListener('change', function(e) {
            let r = new FileReader(); r.onload = (ev) => {
                let wb = XLSX.read(new Uint8Array(ev.target.result), {type: 'array'});
                let raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1});
                dbStock = raw.slice(1).filter(r => r[0]).map(r => ({ 
                    id: r[0].toString(), n: r[1], pCli: parseFloat(r[2]) || 0, pPat: parseFloat(r[3]) || parseFloat(r[2]) || 0 
                }));
                localStorage.setItem(K_STK, JSON.stringify(dbStock)); alert("Catálogo actualizado!");
            }; r.readAsArrayBuffer(e.target.files[0]);
        });

        document.getElementById('xlCli').addEventListener('change', function(e) {
            let r = new FileReader(); r.onload = (ev) => {
                let wb = XLSX.read(new Uint8Array(ev.target.result), {type: 'array'});
                let raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1});
                dbCli = raw.slice(1).filter(r => r[0]).map(r => ({ id: r[0].toString(), nombre: r[1], lista: r[2] || "Clientes" }));
                localStorage.setItem(K_CLI, JSON.stringify(dbCli)); alert("Clientes actualizados!");
            }; r.readAsArrayBuffer(e.target.files[0]);
        });

        document.getElementById('subirLogo').addEventListener('change', function(e) {
            let r = new FileReader(); r.onload = () => { logoB64 = r.result; localStorage.setItem(K_LGO, logoB64); document.getElementById('previewLogo').src=logoB64; document.getElementById('previewLogo').style.display='block'; };
            r.readAsDataURL(e.target.files[0]);
        });

        function borrarHoja() { if(confirm("¿Vaciar?")) { hojaRuta = []; renderHoja(); } }
        function borrarTodo() { if(confirm("¿BORRAR TODO?")) { localStorage.clear(); location.reload(); } }
    </script>
</body>
</html>
