<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión Pro V3</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        :root { --primary: #2563eb; --success: #10b981; --danger: #ef4444; --dark: #1e293b; --light: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); margin: 0; color: var(--dark); }
        
        .navbar { display: flex; background: white; border-bottom: 2px solid #e2e8f0; position: sticky; top: 0; z-index: 100; }
        .nav-btn { flex: 1; padding: 20px; border: none; background: none; font-weight: 700; cursor: pointer; color: #64748b; transition: 0.3s; }
        .nav-btn.active { color: var(--primary); border-bottom: 4px solid var(--primary); background: #f1f5f9; }

        .container { max-width: 800px; margin: 25px auto; padding: 0 15px; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: none; }
        .card.active { display: block; }

        .form-group { margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 16px; box-sizing: border-box; outline: none; }

        .search-box { background: #f1f5f9; padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #e2e8f0; }

        .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; margin-top: 10px; }
        .btn-blue { background: var(--primary); color: white; }
        .btn-green { background: var(--success); color: white; }
        .btn-red { background: var(--danger); color: white; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: left; padding: 12px; background: #f1f5f9; border-radius: 5px; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; }
        
        .delete-btn { color: var(--danger); cursor: pointer; font-weight: bold; text-align: center; }

        #preview-pedido { border: 1px solid #e2e8f0; padding: 15px; border-radius: 10px; margin-top: 20px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <button class="nav-btn active" onclick="switchTab('tab-pedido')">📝 NUEVO PEDIDO</button>
        <button class="nav-btn" onclick="switchTab('tab-catalogo')">📦 CATÁLOGO</button>
    </nav>

    <div class="container">

        <div id="tab-pedido" class="card active">
            <h2>Armar Pedido</h2>
            <div class="form-group">
                <input type="text" id="idCli" placeholder="ID Cliente (Ej: 2026-A)">
                <input type="text" id="nomCli" placeholder="Nombre del Cliente" style="margin-top: 10px;">
            </div>

            <div class="search-box">
                <label style="font-size: 12px; font-weight: bold; color: #64748b;">🔍 BUSCAR PRODUCTO</label>
                <input type="text" id="buscador" placeholder="Escribí para filtrar..." onkeyup="filtrar()">
                <select id="selProd" size="5" style="margin-top: 10px; cursor: pointer;"></select>
            </div>

            <div class="form-group">
                <label>Cantidad</label>
                <input type="number" id="cant" value="1" min="1">
            </div>

            <button class="btn btn-blue" onclick="agregarAlPedido()">+ AGREGAR A LA LISTA</button>

            <div id="preview-pedido">
                <h4 style="margin: 0 0 10px 0;">Resumen Temporal:</h4>
                <table>
                    <thead><tr><th>Cant</th><th>Producto</th><th>Subtotal</th><th></th></tr></thead>
                    <tbody id="cuerpoPedido"></tbody>
                </table>
                <h3 style="text-align: right; color: var(--primary);">TOTAL: $<span id="totalTxt">0.00</span></h3>
            </div>
            
            <button class="btn btn-green" onclick="generarPDF_Pro()">📥 FINALIZAR Y GUARDAR PDF</button>
        </div>

        <div id="tab-catalogo" class="card">
            <h2>Mi Catálogo</h2>
            <div style="background: #ecfdf5; padding: 15px; border-radius: 12px; border: 1px solid #a7f3d0; margin-bottom: 20px;">
                <strong>📂 Importar desde Excel</strong>
                <input type="file" id="excelInput" style="margin-top: 10px;" accept=".xlsx, .xls">
            </div>

            <div class="form-group">
                <input type="text" id="pNombre" placeholder="Nombre del producto">
                <input type="number" id="pPrecio" placeholder="Precio $" style="margin-top: 10px;">
                <button class="btn btn-blue" onclick="agregarManual()">GUARDAR PRODUCTO</button>
            </div>

            <button class="btn btn-red" style="padding: 8px; font-size: 12px;" onclick="vaciarCatalogo()">BORRAR TODO EL CATÁLOGO</button>
            
            <table id="tablaStock">
                <thead><tr><th>Producto</th><th>Precio</th><th></th></tr></thead>
                <tbody id="listaCat"></tbody>
            </table>
        </div>
    </div>

    <script>
        let stock = JSON.parse(localStorage.getItem('db_stock_v3')) || [];
        let pedidoActual = [];

        function switchTab(id) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // --- CATALOGO ---
        function agregarManual() {
            const n = document.getElementById('pNombre').value;
            const p = document.getElementById('pPrecio').value;
            if(n && p) {
                stock.push({n, p: parseFloat(p)});
                actualizarTodo();
                document.getElementById('pNombre').value = ""; document.getElementById('pPrecio').value = "";
            }
        }

        document.getElementById('excelInput').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const wb = XLSX.read(data, {type: 'array'});
                const filas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1});
                filas.forEach((f, i) => { if(i > 0 && f[0] && f[1]) stock.push({n: f[0], p: parseFloat(f[1])}); });
                actualizarTodo();
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        });

        function actualizarTodo() {
            localStorage.setItem('db_stock_v3', JSON.stringify(stock));
            renderCatalogo();
            filtrar();
        }

        function renderCatalogo() {
            const lista = document.getElementById('listaCat');
            lista.innerHTML = "";
            stock.forEach((p, i) => {
                lista.innerHTML += `<tr><td>${p.n}</td><td>$${p.p}</td><td class="delete-btn" onclick="stock.splice(${i},1); actualizarTodo();">✕</td></tr>`;
            });
        }

        function filtrar() {
            const term = document.getElementById('buscador').value.toLowerCase();
            const sel = document.getElementById('selProd');
            sel.innerHTML = "";
            stock.forEach((p, i) => {
                if(p.n.toLowerCase().includes(term)) {
                    sel.innerHTML += `<option value="${i}">${p.n} ($${p.p})</option>`;
                }
            });
        }

        function vaciarCatalogo() { if(confirm("¿Borrar todo?")) { stock = []; actualizarTodo(); } }

        // --- PEDIDO ---
        function agregarAlPedido() {
            const sel = document.getElementById('selProd');
            const i = sel.value;
            const c = parseInt(document.getElementById('cant').value);
            if(i !== "" && c > 0) {
                const p = stock[i];
                pedidoActual.push({n: p.n, p: p.p, c: c, sub: p.p * c});
                renderPedido();
            } else { alert("Seleccioná un producto de la lista."); }
        }

        function renderPedido() {
            const cuerpo = document.getElementById('cuerpoPedido');
            cuerpo.innerHTML = ""; let t = 0;
            pedidoActual.forEach((item, index) => {
                t += item.sub;
                cuerpo.innerHTML += `<tr><td>${item.c}</td><td>${item.n}</td><td>$${item.sub.toFixed(2)}</td><td class="delete-btn" onclick="pedidoActual.splice(${index},1); renderPedido();">✕</td></tr>`;
            });
            document.getElementById('totalTxt').innerText = t.toFixed(2);
        }

        // --- GENERACIÓN DE PDF PROFESIONAL ---
        function generarPDF_Pro() {
            if(pedidoActual.length === 0) return alert("Cargá artículos primero.");
            
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const idCli = document.getElementById('idCli').value || "S-ID";
            const nomCli = document.getElementById('nomCli').value || "Consumidor Final";
            const fecha = new Date().toLocaleString();

            // Encabezado
            doc.setFontSize(18);
            doc.text("ORDEN DE PEDIDO", 105, 15, { align: "center" });
            
            doc.setFontSize(11);
            doc.text(`Cliente: ${nomCli}`, 14, 25);
            doc.text(`ID Cliente: ${idCli}`, 14, 32);
            doc.text(`Fecha: ${fecha}`, 14, 39);

            // Tabla de productos
            const tableData = pedidoActual.map(item => [
                item.c,
                item.n,
                `$${item.p.toFixed(2)}`,
                `$${item.sub.toFixed(2)}`
            ]);

            doc.autoTable({
                startY: 45,
                head: [['Cant', 'Producto', 'Precio Unit.', 'Subtotal']],
                body: tableData,
                theme: 'striped',
                headStyles: { fillColor: [37, 99, 235] } // El azul primary
            });

            // Total
            const finalY = doc.lastAutoTable.finalY + 10;
            doc.setFontSize(14);
            doc.text(`TOTAL A PAGAR: $${document.getElementById('totalTxt').innerText}`, 196, finalY, { align: "right" });

            // Guardar
            doc.save(`${idCli}_${nomCli.replace(/\s+/g, '_')}.pdf`);

            // Limpiar pedido
            alert("¡Pedido guardado!");
            pedidoActual = [];
            document.getElementById('idCli').value = "";
            document.getElementById('nomCli').value = "";
            renderPedido();
        }

        renderCatalogo();
        filtrar();
        vaciarCatalogo(); // Limpiar el pedido si hay basura al cargar
    </script>
</body>
</html>
