<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DistriMar - Gestión con Logo</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        :root { --blue: #0056b3; --green: #25d366; --red: #dc3545; --gray: #f4f7f6; --orange: #fd7e14; --dark: #333; }
        body { font-family: -apple-system, sans-serif; background: var(--gray); margin: 0; padding: 0; color: var(--dark); }
        
        .tabs { display: flex; background: #fff; border-bottom: 2px solid #ddd; position: sticky; top: 0; z-index: 10; overflow-x: auto; }
        .tab-btn { flex: 1; padding: 15px 10px; border: none; background: none; font-weight: bold; cursor: pointer; color: #666; font-size: 12px; white-space: nowrap; }
        .tab-btn.active { color: var(--blue); border-bottom: 4px solid var(--blue); background: #f8faff; }

        .container { max-width: 800px; margin: 10px auto; padding: 10px; }
        .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: none; }
        .card.active { display: block; }

        .badge-lista { display: inline-block; padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; margin-bottom: 10px; }
        .badge-patagonia { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .badge-clientes { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }

        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-blue { background: var(--blue); }
        .btn-green { background: var(--green); }
        .btn-gray { background: #6c757d; }
        .btn-red { background: var(--red); font-size: 11px; width: auto; padding: 8px 12px; }

        .search-area { background: #f1f3f5; padding: 15px; border-radius: 12px; margin: 15px 0; border: 1px solid #dee2e6; }
        .lista-resultados { max-height: 180px; overflow-y: auto; background: white; border: 1px solid #ccc; border-radius: 8px; margin-top: 5px; }
        .item-prod { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; cursor: pointer; display: flex; justify-content: space-between; }
        .item-prod.seleccionado { background: var(--blue); color: white; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { text-align: left; padding: 10px 5px; border-bottom: 1px solid #eee; }
        .remove { color: var(--red); cursor: pointer; font-weight: bold; font-size: 16px; }
        
        #previewLogo { max-width: 100px; display: block; margin: 10px 0; border-radius: 5px; }
    </style>
</head>
<body>

    <nav class="tabs">
        <button class="tab-btn active" onclick="verTab('pedido')">📝 PEDIDO</button>
        <button class="tab-btn" onclick="verTab('remito')">🚚 REMITO</button>
        <button class="tab-btn" onclick="verTab('catalogo')">⚙️ AJUSTES</button>
    </nav>

    <div class="container">

        <div id="pedido" class="card active">
            <div id="ind-ped" class="badge-lista badge-clientes">Lista: Clientes</div>
            <input type="text" id="idCli-ped" placeholder="ID Cliente..." onkeyup="buscarCli('ped')">
            <input type="text" id="nomCli-ped" placeholder="Nombre Cliente">

            <div class="search-area">
                <input type="text" id="bus-ped" placeholder="Buscar producto..." onkeyup="filtrar('ped')">
                <div id="res-ped" class="lista-resultados"></div>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <input type="number" id="cant-ped" value="1" style="width:70px; margin:0">
                    <button class="btn btn-blue" onclick="agregar('ped')" style="margin:0; flex:1">+ AGREGAR</button>
                </div>
            </div>
            <table id="tabla-ped">
                <thead><tr><th>Cant</th><th>Detalle</th><th>Sub</th><th></th></tr></thead>
                <tbody id="body-ped"></tbody>
            </table>
            <h3 style="text-align:right">TOTAL: $<span id="total-ped">0.00</span></h3>
            <button class="btn btn-green" onclick="procesarDocumento('pedido')">🟢 MANDAR POR WHATSAPP</button>
        </div>

        <div id="remito" class="card">
            <div id="ind-rem" class="badge-lista badge-clientes">Lista: Clientes</div>
            <input type="text" id="idCli-rem" placeholder="ID Cliente..." onkeyup="buscarCli('rem')">
            <input type="text" id="nomCli-rem" placeholder="Nombre Cliente">

            <div class="search-area">
                <input type="text" id="bus-rem" placeholder="Buscar producto..." onkeyup="filtrar('rem')">
                <div id="res-rem" class="lista-resultados"></div>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <input type="number" id="cant-rem" value="1" style="width:70px; margin:0">
                    <button class="btn btn-blue" onclick="agregar('rem')" style="margin:0; flex:1">+ AGREGAR</button>
                </div>
            </div>
            <table id="tabla-rem">
                <thead><tr><th>Cant</th><th>Detalle</th><th>Sub</th><th></th></tr></thead>
                <tbody id="body-rem"></tbody>
            </table>
            <h3 style="text-align:right">TOTAL: $<span id="total-rem">0.00</span></h3>
            <button class="btn btn-gray" onclick="procesarDocumento('remito')">💾 GUARDAR REMITO (PDF)</button>
        </div>

        <div id="catalogo" class="card">
            <h3>Cargar Logo de Empresa</h3>
            <input type="file" id="subirLogo" accept="image/*">
            <img id="previewLogo" src="" alt="Vista previa del logo" style="display:none;">
            
            <hr>
            <h3>Cargar Stock (Excel)</h3>
            <input type="file" id="xlStock" accept=".xlsx, .xls">
            
            <hr>
            <h3>Cargar Clientes (Excel)</h3>
            <input type="file" id="xlCli" accept=".xlsx, .xls">
            
            <br><br>
            <button class="btn-red" onclick="borrarTodo()">⚠️ BORRAR TODA LA BASE DE DATOS</button>
        </div>

    </div>

    <script>
        let dbStock = JSON.parse(localStorage.getItem('dm_stock_v8')) || [];
        let dbCli = JSON.parse(localStorage.getItem('dm_cli_v8')) || [];
        let logoBase64 = localStorage.getItem('dm_logo_v8') || "";
        let ordenes = { ped: [], rem: [] };
        let listas = { ped: "Clientes", rem: "Clientes" };
        let selIdx = { ped: null, rem: null };

        if(logoBase64) { 
            document.getElementById('previewLogo').src = logoBase64; 
            document.getElementById('previewLogo').style.display = 'block';
        }

        function verTab(id) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // --- MANEJO DEL LOGO ---
        document.getElementById('subirLogo').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onloadend = function() {
                logoBase64 = reader.result;
                localStorage.setItem('dm_logo_v8', logoBase64);
                document.getElementById('previewLogo').src = logoBase64;
                document.getElementById('previewLogo').style.display = 'block';
                alert("Logo guardado correctamente.");
            }
            reader.readAsDataURL(file);
        });

        // --- LÓGICA DE DATOS (Simplificada) ---
        function buscarCli(tipo) {
            let id = document.getElementById(`idCli-${tipo}`).value.trim().toLowerCase();
            let c = dbCli.find(cli => cli.id.toString().toLowerCase() === id);
            if(c) {
                document.getElementById(`nomCli-${tipo}`).value = c.nombre;
                listas[tipo] = c.lista.toLowerCase().includes("patagonia") ? "Patagonia" : "Clientes";
            } else { listas[tipo] = "Clientes"; }
            actualizarUI(tipo);
        }

        function actualizarUI(tipo) {
            let ind = document.getElementById(`ind-${tipo}`);
            ind.innerText = `Lista: ${listas[tipo]}`;
            ind.className = `badge-lista badge-${listas[tipo].toLowerCase()}`;
            filtrar(tipo);
        }

        function filtrar(tipo) {
            let bus = document.getElementById(`bus-${tipo}`).value.toLowerCase();
            let box = document.getElementById(`res-${tipo}`);
            box.innerHTML = ""; selIdx[tipo] = null;
            dbStock.forEach((p, i) => {
                if(p.n.toLowerCase().includes(bus)) {
                    let pre = (listas[tipo] === "Patagonia") ? p.pPat : p.pCli;
                    let div = document.createElement('div');
                    div.className = 'item-prod';
                    div.innerHTML = `<span>${p.n}</span> <strong>$${pre.toFixed(2)}</strong>`;
                    div.onclick = () => {
                        selIdx[tipo] = i;
                        div.parentNode.querySelectorAll('.item-prod').forEach(e => e.classList.remove('seleccionado'));
                        div.classList.add('seleccionado');
                    };
                    box.appendChild(div);
                }
            });
        }

        function agregar(tipo) {
            let cant = parseInt(document.getElementById(`cant-${tipo}`).value);
            if(selIdx[tipo] !== null && cant > 0) {
                let p = dbStock[selIdx[tipo]];
                let pre = (listas[tipo] === "Patagonia") ? p.pPat : p.pCli;
                ordenes[tipo].push({n: p.n, p: pre, c: cant, sub: pre * cant});
                renderTablas(tipo);
                document.getElementById(`bus-${tipo}`).value = ""; filtrar(tipo);
            }
        }

        function renderTablas(tipo) {
            let h = ""; let t = 0;
            ordenes[tipo].forEach((it, i) => {
                t += it.sub;
                h += `<tr><td>${it.c}</td><td>${it.n}</td><td>$${it.sub.toFixed(2)}</td><td class="remove" onclick="ordenes['${tipo}'].splice(${i},1);renderTablas('${tipo}')">✕</td></tr>`;
            });
            document.getElementById(`total-${tipo}`).innerText = t.toFixed(2);
            document.getElementById(`body-${tipo}`).innerHTML = h;
        }

        // --- GENERACIÓN DE PDF ---
        async function procesarDocumento(modo) {
            const tipo = (modo === 'pedido') ? 'ped' : 'rem';
            if(ordenes[tipo].length === 0) return alert("Pedido vacío");
            
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let id = document.getElementById(`idCli-${tipo}`).value || "00";
            let nom = document.getElementById(`nomCli-${tipo}`).value || "Cliente";

            // SI HAY LOGO, LO PONEMOS
            if(logoBase64) {
                try { doc.addImage(logoBase64, 'PNG', 14, 10, 40, 40); } catch(e) { console.error("Error logo", e); }
            }

            if(modo === 'remito') {
                doc.setFontSize(22); doc.setFont("helvetica", "bold");
                doc.text("DISTRIMAR", 105, 20, {align:"center"});
                doc.setFontSize(10); doc.setFont("helvetica", "normal");
                doc.text("Puerto Madryn, Chubut", 105, 26, {align:"center"});
                doc.text("Tel/Whatsapp: 2804691951", 105, 31, {align:"center"});
                doc.line(10, 55, 200, 55);
                doc.setFontSize(24); doc.text("REMITO", 105, 68, {align:"center"});
                doc.setFontSize(9); doc.text("DOCUMENTO NO VALIDO COMO FACTURA", 105, 75, {align:"center"});
                doc.rect(100, 78, 10, 10); doc.text("X", 105, 85, {align:"center"});
                
                doc.setFontSize(11);
                doc.text(`Cliente: ${nom} (${id})`, 14, 105);
                doc.text(`Fecha: ${new Date().toLocaleDateString()}`, 160, 105);
                
                let data = ordenes.rem.map(it => [it.c, it.n, `$${it.p.toFixed(2)}`, `$${it.sub.toFixed(2)}`]);
                doc.autoTable({
                    startY: 115,
                    head: [['Cant', 'Producto', 'Precio U.', 'Subtotal']],
                    body: data,
                    theme: 'grid',
                    headStyles: { fillColor: [40, 40, 40] }
                });
                doc.text(`TOTAL: $${document.getElementById('total-rem').innerText}`, 196, doc.lastAutoTable.finalY + 12, {align:"right"});
                doc.line(20, doc.lastAutoTable.finalY + 40, 80, doc.lastAutoTable.finalY + 40);
                doc.text("Firma de Recibido", 25, doc.lastAutoTable.finalY + 45);
                doc.save(`Remito_${nom}.pdf`);
            } else {
                doc.setFontSize(18); doc.text("PEDIDO DISTRIMAR", 105, 25, {align:"center"});
                doc.setFontSize(11);
                doc.text(`Cliente: ${nom} (${id})`, 60, 35);
                doc.text(`Lista: ${listas.ped}`, 60, 41);
                let data = ordenes.ped.map(it => [it.c, it.n, `$${it.p.toFixed(2)}`, `$${it.sub.toFixed(2)}`]);
                doc.autoTable({ startY: 55, head: [['Cant', 'Producto', 'P.U', 'Subtotal']], body: data });
                
                const pdfBlob = doc.output('blob');
                const file = new File([pdfBlob], `Pedido_${nom}.pdf`, { type: 'application/pdf' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: `Pedido DistriMar` });
                } else { doc.save(`Pedido_${nom}.pdf`); }
            }
            ordenes[tipo] = []; renderTablas(tipo);
        }

        // --- CARGA EXCEL ---
        document.getElementById('xlStock').addEventListener('change', function(e) {
            let reader = new FileReader();
            reader.onload = (e) => {
                let wb = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
                let filas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1});
                dbStock = []; filas.forEach((f, i) => { if(i>0 && f[0]) dbStock.push({n: f[0], pCli: parseFloat(f[1]) || 0, pPat: parseFloat(f[2]) || 0}); });
                localStorage.setItem('dm_stock_v8', JSON.stringify(dbStock)); alert("Stock cargado");
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        });

        document.getElementById('xlCli').addEventListener('change', function(e) {
            let reader = new FileReader();
            reader.onload = (e) => {
                let wb = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
                let filas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1});
                dbCli = []; filas.forEach((f, i) => { if(i>0 && f[0]) dbCli.push({id: f[0].toString(), nombre: f[1], lista: f[2] || "Clientes"}); });
                localStorage.setItem('dm_cli_v8', JSON.stringify(dbCli)); alert("Clientes cargados");
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        });

        function borrarTodo() { if(confirm("¿Borrar todo?")) { localStorage.clear(); location.reload(); } }
    </script>
</body>
</html>
